<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription confirmée — Vie à deux</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #FAF6F0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 20px; padding: 60px 48px; text-align: center; max-width: 440px; box-shadow: 0 20px 60px rgba(58,34,24,.12); }
    .heart { font-size: 3rem; margin-bottom: 20px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; color: #3A2218; margin-bottom: 12px; }
    p { color: #7A6E68; line-height: 1.7; margin-bottom: 28px; }
    a { display: inline-block; padding: 13px 30px; background: #8B1A1A; color: #fff; border-radius: 12px; text-decoration: none; font-size: 0.9rem; transition: background .2s; }
    a:hover { background: #B94040; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">♡</div>
    <h1>Bienvenue !</h1>
    <p>Votre inscription a bien été enregistrée. Nous reviendrons vers vous très prochainement.</p>
    <a href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
